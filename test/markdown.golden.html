<!DOCTYPE html>
<html><body>
<h1>lg</h1>
<p>A <em>tiny</em> language that emits <strong>OCaml</strong>.</p>
<h2>Features</h2>
<ul><li>static inference</li><li><code>defvariant</code> + <code>match</code></li><li>FBIP <a href="https://github.com/tiensonqin/lg2">builders</a></li></ul>
<pre><code>(defn fib [n]
  (if (&lt; n 2) n (+ (fib (- n 1)) (fib (- n 2)))))</code></pre>
<p>Tail <em>em</em> and <strong>strong</strong> and <code>code</code>.</p>
</body></html>
